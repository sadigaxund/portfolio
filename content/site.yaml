# The map of the site. Each node becomes a page at its parent's URL plus its slug.
# A leaf's note lives at content/<url path>.md or .mk.md, such as
# content/professional/career.mk.md for /professional/career.
#
# A node has these fields:
#   slug      lowercase letters, digits, and hyphens. Unique among siblings.
#   label     the name shown on the site.
#   side      on the root's children only: left, straight, or right.
#             One road per side for now. Scrolling continues down the straight road.
#   summary   one line, on a section only (a node with children).
#   preview   one line, on a leaf only (a node without children).
#   children  nodes below this one, in display order.

# The root is the landing page. Its label is the name shown there.
